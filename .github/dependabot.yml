version: 2
updates:
  # Actions stay pinned to commit SHAs; Dependabot rewrites the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    # Majors are not grouped, so each one arrives as its own pull request.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    # A dependency joins the first group it matches, so the order below matters.
    groups:
      # Plugin and parser must move together, majors included.
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Blocked until the lint config moves to flat config.
      - dependency-name: eslint
        versions: ['>=9.0.0']
      # TypeScript 6 needs a migration first (TS5101: baseUrl); typescript-eslint 8.71 supports <6.1.
      - dependency-name: typescript
        versions: ['>=6.0.0']
      # Library types follow the lowest supported Node (18).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      # Dev tooling Node floor is a deliberate decision, tracked in #23.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      # Runtime dependency: major upgrades only by deliberate review.
      - dependency-name: react-tooltip
        update-types: ['version-update:semver-major']
      # Needs Vite 8.
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      # The package supports React 16.14 to 19; the dev copy tracks 18.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
