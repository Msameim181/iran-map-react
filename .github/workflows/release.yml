name: Release

# Runs when a version tag (v*) is pushed. The tag must be an annotated or lightweight tag on a commit that is on
# main and equal to the package.json version. Stages:
#   verify          read-only: lint, tests, build, package lint, consumer checks on the packed tarball
#   publish-github  GitHub Packages (needs packages: write)
#   publish-npm     npmjs.com via trusted publishing (OIDC, no token); skipped until the NPM_PUBLISH variable is 'true'
#   github-release  GitHub Release with the CHANGELOG notes
# Re-running is safe: a version that already exists on a registry or as a release is skipped.
#
# Dry run: start this workflow manually (workflow_dispatch) on any branch, for example
#   gh workflow run release.yml --ref <branch>
# verify runs as for a tag, minus the tag checks; dry-run-npm and dry-run-github then repeat the publish jobs' setup
# (setup-node, npm, download-artifact) with read-only permissions and end in `npm publish --dry-run`. The real
# publish jobs and the GitHub Release only run for a pushed tag, never for a dispatch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main and match package.json (dry runs skip the tag checks)
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
          else
            echo "Dry run on $GITHUB_REF_NAME: tag checks skipped"
          fi
          if grep -nE '"file:|"link": true' package.json package-lock.json; then echo "::error::local file link found"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
      - run: npm run test:dist
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP" --silent && mv "$RUNNER_TEMP"/*.tgz package.tgz
      - name: Verify the packed tarball
        run: TARBALL=package.tgz node scripts/verify-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: package.tgz
          retention-days: 7

  publish-github:
    needs: verify
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if npm view "@msameim181/iran-map-react@$VERSION" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@msameim181/iran-map-react@$VERSION is already on GitHub Packages; skipping"
            exit 0
          fi
          tag=latest; [ "$PRERELEASE" = "true" ] && tag=next
          npm publish package.tgz --registry https://npm.pkg.github.com --access public --tag "$tag"

  # Trusted publishing: configure this workflow as the trusted publisher on npmjs.com, then set the repository
  # variable NPM_PUBLISH=true. No token is stored anywhere. The package.json repository.url must match this repo.
  publish-npm:
    needs: verify
    if: ${{ github.event_name == 'push' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm >= 11.5.1; pinned exactly because this job can mint an OIDC token
        run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Publish to npmjs.com
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if npm view "@msameim181/iran-map-react@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@msameim181/iran-map-react@$VERSION is already on npmjs.com; skipping"
            exit 0
          fi
          tag=latest; [ "$PRERELEASE" = "true" ] && tag=next
          npm publish package.tgz --registry https://registry.npmjs.org --access public --provenance --tag "$tag"

  # Dry run (workflow_dispatch only). Same setup as publish-npm, but read-only: no id-token, no packages: write, and
  # no NODE_AUTH_TOKEN, exactly as the real npm job runs. The final command cannot publish.
  dry-run-npm:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Same npm as the publish job
        run: npm install -g npm@11.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Dry-run publish to npmjs.com
        run: |
          set -euo pipefail
          npm --version
          npm config get registry
          ls -l package.tgz
          set +e
          out="$(npm publish package.tgz --dry-run --access public --registry https://registry.npmjs.org --tag next 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # The registry was reached and the config accepted; the real job skips an existing version before this point.
            echo "$out" | grep -q 'previously published' || exit "$code"
            echo "::notice::this version is already published; the real job would skip it"
          fi

  # Dry run (workflow_dispatch only). Same setup as publish-github with the same token, but only contents: read.
  dry-run-github:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - name: Dry-run publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l package.tgz
          set +e
          out="$(npm publish package.tgz --dry-run --access public --registry https://npm.pkg.github.com --tag next 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 0 ]; then
            # The registry was reached and the config accepted; the real job skips an existing version before this point.
            echo "$out" | grep -q 'previously published' || exit "$code"
            echo "::notice::this version is already published; the real job would skip it"
          fi

  github-release:
    needs: [verify, publish-github]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          # Notes: the "## <version>" section of CHANGELOG.md.
          awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" {found=1; next} found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG section for $VERSION"; exit 1; }
          flags=""; [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags
