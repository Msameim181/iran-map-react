name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # `file:../iran-map-core` is the dev link until core is published. actions/checkout cannot
      # write outside $GITHUB_WORKSPACE, so both repos are checked out side by side inside it.
      - name: Check out iran-map-react
        uses: actions/checkout@v6
        with:
          path: iran-map-react
      - name: Check out iran-map-core
        uses: actions/checkout@v6
        with:
          repository: Msameim181/iran-map-core
          path: iran-map-core
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            iran-map-react/package-lock.json
            iran-map-core/package-lock.json
      - name: Build core
        working-directory: iran-map-core
        run: npm ci && npm run build
      - name: Install
        working-directory: iran-map-react
        run: npm ci
      - name: Lint
        working-directory: iran-map-react
        run: npm run lint
      - name: Format check
        working-directory: iran-map-react
        run: npm run format:check
      - name: Typecheck
        working-directory: iran-map-react
        run: npm run typecheck
      - name: Test
        working-directory: iran-map-react
        run: npm test
      - name: Build
        working-directory: iran-map-react
        run: npm run build
