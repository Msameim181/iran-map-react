name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          # Writes the @msameim181 scope + auth line to .npmrc; NODE_AUTH_TOKEN fills in the token.
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - name: Refuse local file dependencies
        run: "! grep -n '\"file:' package.json"
      # `npm install`, not `npm ci`: the lockfile has no entry for @msameim181/iran-map-core yet because it
      # cannot be resolved without a read:packages token. Switch to `npm ci` once a maintainer commits one.
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
