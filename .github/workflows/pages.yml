name: Deploy demo to GitHub Pages

# Deploys the demo to GitHub Pages (Settings > Pages > Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@msameim181'
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build demo
        run: npm run demo:build -- --base /iran-map-react/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
